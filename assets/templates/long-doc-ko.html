<!doctype html>
<html lang="ko" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{company_ko}} 투자 메모</title>
  <style>
    @page { size: A4; margin: 18mm; }
    :root {
      --canvas: #fbfaf7;
      --surface: #ffffff;
      --ink: #17171c;
      --muted: #656779;
      --hairline: #dddfe8;
      --band: #071829;
      --accent: #1863dc;
      --semiconductor: #0f766e;
      --font: Pretendard, "Noto Sans KR", Inter, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    [data-theme="dark"] {
      --canvas: #080d14;
      --surface: #101824;
      --ink: #f5f7fb;
      --muted: #a8b0c2;
      --hairline: #263244;
      --band: #dfe8ff;
      --accent: #7fb4ff;
      --semiconductor: #6ee7c8;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--canvas); }
    body {
      color: var(--ink);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.66;
      margin: 0;
      word-break: keep-all;
    }
    @media screen { body { padding: 18mm; } }
    .page { display: grid; gap: 18px; }
    header {
      border-bottom: 1px solid var(--hairline);
      display: grid;
      gap: 14px;
      padding-bottom: 20px;
    }
    .notice {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
    }
    .masthead {
      align-items: end;
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr auto;
    }
    h1 {
      color: var(--band);
      font-size: 34px;
      font-weight: 680;
      line-height: 1.14;
      margin: 0;
    }
    .company {
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      padding: 7px 11px;
      white-space: nowrap;
    }
    .summary {
      background: var(--band);
      border-radius: 8px;
      color: var(--canvas);
      padding: 18px 20px;
    }
    .summary h2,
    section h2 {
      font-size: 15px;
      line-height: 1.3;
      margin: 0 0 8px;
    }
    .summary p,
    section p { margin: 0; }
    .memo-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    section {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      min-height: 92px;
      padding: 16px;
    }
    section h2 { color: var(--semiconductor); }
    .full { grid-column: 1 / -1; }
    .investment-view {
      border-left: 4px solid var(--accent);
    }
    @media print {
      html, body { background: transparent; }
      body { font-size: 12px; }
      section, .summary { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <article class="page">
    <header>
      <div class="notice">{{sample_notice_ko}}</div>
      <div class="masthead">
        <h1>{{memo_title_ko}}</h1>
        <div class="company">{{company_ko}}</div>
      </div>
    </header>

    <section class="summary">
      <h2>핵심 요약</h2>
      <p>{{executive_summary_ko}}</p>
    </section>

    <div class="memo-grid">
      <section>
        <h2>왜 지금인가</h2>
        <p>{{why_now_ko}}</p>
      </section>
      <section>
        <h2>제품 접점</h2>
        <p>{{product_surface_ko}}</p>
      </section>
      <section>
        <h2>시장 진입점</h2>
        <p>{{market_wedge_ko}}</p>
      </section>
      <section>
        <h2>비즈니스 모델</h2>
        <p>{{business_model_ko}}</p>
      </section>
      <section>
        <h2>기술 해자</h2>
        <p>{{technology_moat_ko}}</p>
      </section>
      <section>
        <h2>리스크 등록부</h2>
        <p>{{risk_register_ko}}</p>
      </section>
      <section class="full investment-view">
        <h2>투자 관점</h2>
        <p>{{investment_view_ko}}</p>
      </section>
    </div>
  </article>
</body>
</html>
