<!doctype html>
<html lang="ko" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{product_name}}</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");
    :root {
      --canvas: #fbfaf7;
      --surface: #ffffff;
      --ink: #17171c;
      --muted: #656779;
      --hairline: #dddfe8;
      --band: #071829;
      --accent: #1863dc;
      --accent-soft: #dfe8ff;
      --font: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --canvas: #080d14;
      --surface: #101824;
      --ink: #f5f7fb;
      --muted: #a8b0c2;
      --hairline: #263244;
      --band: #dfe8ff;
      --accent: #7fb4ff;
      --accent-soft: #16233a;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); overflow-x: hidden; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      margin: 0;
      overflow-x: hidden;
      word-break: keep-all;
    }
    header {
      align-items: center;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      gap: 14px;
      justify-content: space-between;
      padding: 20px 32px;
      flex-wrap: wrap;
    }
    .actions {
      align-items: center;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }
    a,
    button {
      border-radius: 999px;
      font: inherit;
    }
    header a,
    [data-theme-toggle] {
      background: transparent;
      border: 1px solid var(--hairline);
      color: var(--ink);
      padding: 8px 14px;
      text-decoration: none;
    }
    [data-theme-toggle] { cursor: pointer; }
    main {
      display: grid;
      gap: 56px;
      padding: 72px 32px 80px;
    }
    .hero {
      align-items: stretch;
      display: grid;
      gap: 44px;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      min-height: 68vh;
    }
    .copy {
      align-content: center;
      display: grid;
      gap: 24px;
      max-width: 820px;
    }
    h1 {
      color: var(--band);
      font-size: clamp(42px, 5.6vw, 58px);
      font-weight: 650;
      line-height: 1.12;
      margin: 0;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    p {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.62;
      margin: 0;
      max-width: 680px;
    }
    .button {
      background: var(--ink);
      color: var(--canvas);
      display: inline-block;
      justify-self: start;
      padding: 13px 22px;
      text-decoration: none;
    }
    .panel {
      align-content: end;
      background: var(--band);
      border-radius: 8px;
      color: var(--canvas);
      display: grid;
      min-height: 420px;
      padding: 32px;
    }
    .panel p {
      color: color-mix(in srgb, var(--canvas) 82%, transparent);
      font-size: 24px;
      line-height: 1.45;
    }
    .features {
      border-top: 1px solid var(--hairline);
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding-top: 28px;
    }
    .feature {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.55;
      min-height: 132px;
      padding: 22px;
    }
    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        padding: 18px 20px;
      }
      header strong {
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      main { gap: 40px; padding: 44px 20px 56px; }
      .hero { grid-template-columns: 1fr; min-height: auto; }
      body { word-break: normal; }
      h1 { font-size: clamp(32px, 10vw, 40px); }
      p,
      .panel p {
        font-size: 18px;
        overflow-wrap: anywhere;
      }
      .copy,
      .panel,
      .feature {
        max-width: 100%;
        min-width: 0;
      }
      .panel { min-height: 260px; }
      .features { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .actions {
        justify-content: flex-start;
        width: 100%;
      }
      header a,
      [data-theme-toggle] {
        max-width: 100%;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <header>
    <strong>{{product_name}}</strong>
    <div class="actions">
      <button type="button" data-theme-toggle aria-label="테마 전환">테마</button>
      <a href="{{cta_url}}">{{cta_label}}</a>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="copy">
        <h1>{{headline}}</h1>
        <p>{{subhead}}</p>
        <a class="button" href="{{cta_url}}">{{cta_label}}</a>
      </div>
      <div class="panel"><p>{{proof_panel}}</p></div>
    </section>
    <section class="features">
      <div class="feature">{{feature_1}}</div>
      <div class="feature">{{feature_2}}</div>
      <div class="feature">{{feature_3}}</div>
    </section>
  </main>
  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('[data-theme-toggle]');
    let saved = null;
    try {
      saved = localStorage.getItem('gyeol-theme');
    } catch {
      saved = null;
    }
    if (saved) root.dataset.theme = saved;
    toggle?.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try {
        localStorage.setItem('gyeol-theme', next);
      } catch {
        /* Theme still changes for this page view when storage is unavailable. */
      }
    });
  </script>
</body>
</html>
