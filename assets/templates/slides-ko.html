<!doctype html>
<html lang="ko" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <title>{{company_ko}} 전략 발표자료</title>
  <style>
    @page { size: 16in 9in; margin: 0; }
    :root {
      --canvas: #fbfaf7;
      --surface: #ffffff;
      --ink: #17171c;
      --muted: #656779;
      --hairline: #dddfe8;
      --band: #071829;
      --accent: #1863dc;
      --accent-soft: #dfe8ff;
      --font: Pretendard, "Noto Sans KR", Inter, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    [data-theme="dark"] {
      --canvas: #080d14;
      --surface: #101824;
      --ink: #f5f7fb;
      --muted: #a8b0c2;
      --hairline: #263244;
      --band: #dfe8ff;
      --accent: #7fb4ff;
      --accent-soft: #16233a;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--canvas); }
    body {
      color: var(--ink);
      font-family: var(--font);
      margin: 0;
      word-break: keep-all;
    }
    .slide {
      aspect-ratio: 16 / 9;
      background: var(--canvas);
      border-bottom: 1px solid var(--hairline);
      display: grid;
      min-height: 720px;
      padding: 64px;
      page-break-after: always;
    }
    @media screen { .slide { min-height: 100vh; } }
    .title {
      align-content: space-between;
      background: var(--band);
      color: var(--canvas);
    }
    .title .kicker,
    .title .company,
    .title p { color: color-mix(in srgb, var(--canvas) 78%, transparent); }
    .topline {
      align-items: center;
      display: flex;
      gap: 18px;
      justify-content: space-between;
    }
    .kicker,
    .notice {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 14px;
      text-transform: uppercase;
    }
    .company {
      border: 1px solid currentColor;
      border-radius: 999px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      padding: 7px 11px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    h1 {
      color: inherit;
      font-size: 62px;
      font-weight: 650;
      line-height: 1.12;
      margin: 0;
      max-width: 1020px;
    }
    h2 {
      color: var(--band);
      font-size: 40px;
      font-weight: 650;
      line-height: 1.18;
      margin: 0 0 24px;
      max-width: 940px;
    }
    p {
      color: var(--muted);
      font-size: 23px;
      line-height: 1.55;
      margin: 0;
      max-width: 920px;
    }
    .title p {
      font-size: 25px;
      margin-top: 24px;
    }
    .grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 40px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: grid;
      gap: 14px;
      padding: 26px;
    }
    .panel strong {
      color: var(--ink);
      font-size: 25px;
      font-weight: 650;
      line-height: 1.25;
    }
    .panel p { font-size: 20px; }
    .plan {
      align-items: stretch;
      display: grid;
      gap: 20px;
      grid-template-columns: 1.1fr 0.9fr;
      margin-top: 34px;
    }
    .statement {
      background: var(--accent-soft);
      border-radius: 8px;
      color: var(--ink);
      padding: 28px;
    }
    .statement p { color: var(--ink); }
    .ask {
      align-self: end;
      border-top: 1px solid var(--hairline);
      display: grid;
      gap: 14px;
      padding-top: 26px;
    }
    .ask strong {
      color: var(--band);
      font-size: 30px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <section class="slide title">
    <div class="topline">
      <div class="kicker">{{deck_label_ko}}</div>
      <div class="company">{{company_ko}}</div>
    </div>
    <div>
      <div class="notice">{{sample_notice_ko}}</div>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </div>
  </section>
  <section class="slide">
    <div>
      <div class="notice">{{sample_notice_ko}}</div>
      <h2>전략 가설</h2>
      <div class="grid">
        <div class="panel">
          <strong>{{assertion_1_ko}}</strong>
          <p>{{evidence_1_ko}}</p>
        </div>
        <div class="panel">
          <strong>{{assertion_2_ko}}</strong>
          <p>{{evidence_2_ko}}</p>
        </div>
      </div>
    </div>
  </section>
  <section class="slide">
    <div>
      <div class="notice">{{company_ko}}</div>
      <h2>실행 계획과 요청</h2>
      <div class="plan">
        <div class="statement"><p>{{roadmap_ko}}</p></div>
        <div class="panel">
          <strong>리스크 등록부</strong>
          <p>{{risk_register_ko}}</p>
        </div>
      </div>
      <div class="ask">
        <strong>투자자 요청</strong>
        <p>{{investor_ask_ko}}</p>
      </div>
    </div>
  </section>
</body>
</html>
