<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>결 문서 시스템 포트폴리오</title>
  <style>
    @page { size:A4; margin:18mm; }
    :root { --ink:#17171c; --slate:#61616f; --hairline:#dedee6; --mineral:#f4f3ee; --dark:#071829; --blue:#1863dc; --font:Pretendard, "Noto Sans KR", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace; }
    body { color:var(--ink); font-family:var(--font); line-height:1.6; margin:0; word-break:keep-all; }
    @media screen { body { padding:18mm; } }
    header { background:var(--dark); border-radius:8px; color:white; padding:28px; }
    .eyebrow { color:var(--blue); font-family:var(--mono); font-size:12px; }
    h1 { font-size:38px; line-height:1.14; margin:10px 0; }
    .grid { display:grid; gap:16px; grid-template-columns:1fr 1fr; margin-top:22px; }
    .project { border:1px solid var(--hairline); border-radius:8px; padding:18px; page-break-inside:avoid; }
    .project h2 { font-size:21px; margin:0 0 8px; }
    .tag { background:var(--mineral); border-radius:4px; display:inline-block; font-family:var(--mono); font-size:11px; margin-top:12px; padding:5px 7px; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">오픈 문서 스택</div>
    <h1>결 문서 시스템</h1>
    <p>에이전트 초안을 한국어와 영어 네이티브 산출물로 정리하는 템플릿 묶음입니다.</p>
  </header>
  <main class="grid">
    <article class="project"><h2>원페이지 시스템</h2><p>결정, 근거, 리스크, 지표를 한 장의 임원용 페이지로 압축합니다.</p><span class="tag">brief</span></article>
    <article class="project"><h2>긴 문서 시스템</h2><p>리서치와 제안서를 읽기 좋은 리포트 흐름으로 정리합니다.</p><span class="tag">report</span></article>
    <article class="project"><h2>덱 시스템</h2><p>장식보다 의사결정에 집중한 발표자료를 만듭니다.</p><span class="tag">slides</span></article>
    <article class="project"><h2>변경 기록 시스템</h2><p>제품 변경 사항을 간결하고 읽기 좋게 정리합니다.</p><span class="tag">release</span></article>
  </main>
</body>
</html>
