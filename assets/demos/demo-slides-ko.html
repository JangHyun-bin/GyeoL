<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>네이티브 문서는 인프라입니다</title>
  <style>
    @page { size: 16in 9in; margin: 0; }
    :root { --ink:#17171c; --slate:#61616f; --hairline:#dedee6; --dark:#071829; --blue:#1863dc; --canvas:#ffffff; --font:Pretendard, "Noto Sans KR", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace; }
    * { box-sizing: border-box; }
    body { background: var(--canvas); color: var(--ink); font-family: var(--font); margin: 0; word-break: keep-all; }
    .slide { aspect-ratio: 16 / 9; border-bottom: 1px solid var(--hairline); display: grid; min-height: 720px; padding: 64px; page-break-after: always; }
    @media screen { .slide { min-height: 100vh; } }
    .title { align-content: end; background: var(--dark); color: #ffffff; }
    .kicker { color: var(--blue); font-family: var(--mono); font-size: 15px; margin-bottom: 20px; }
    h1 { font-size: 62px; font-weight: 650; line-height: 1.12; margin: 0; max-width: 980px; }
    h2 { font-size: 40px; font-weight: 650; line-height: 1.18; margin: 0 0 24px; }
    p { color: var(--slate); font-size: 23px; max-width: 860px; }
    .title p { color: rgba(255,255,255,0.78); }
    .cols { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
    .card { border: 1px solid var(--hairline); border-radius: 8px; padding: 24px; }
    .card strong { display: block; font-size: 23px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <section class="slide title">
    <div>
      <div class="kicker">Gyeol Deck</div>
      <h1>네이티브 문서는 인프라입니다</h1>
      <p>작은 템플릿 registry만 있어도 에이전트 산출물은 반복 가능하고 검증 가능한 문서가 됩니다.</p>
    </div>
  </section>
  <section class="slide">
    <div>
      <h2>데모가 생기면 달라지는 것</h2>
      <p>팀은 템플릿의 약속이 아니라 실제 페이지를 보고 판단할 수 있습니다.</p>
      <div class="cols">
        <div class="card"><strong>보이는 품질</strong>filled example은 간격, 호흡, 문장 문제를 바로 드러냅니다.</div>
        <div class="card"><strong>반복 검증</strong>registry 테스트가 템플릿 drift를 숨기지 못하게 합니다.</div>
        <div class="card"><strong>더 나은 프롬프트</strong>에이전트는 추상 규칙보다 구체 예시를 기준으로 작업합니다.</div>
      </div>
    </div>
  </section>
</body>
</html>
