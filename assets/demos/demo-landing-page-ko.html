<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결</title>
  <style>
    :root {
      --canvas: #fbfaf7;
      --surface: #ffffff;
      --ink: #17171c;
      --muted: #656779;
      --hairline: #dddfe8;
      --band: #071829;
      --accent: #1863dc;
      --accent-soft: #dfe8ff;
      --font: Pretendard, "Noto Sans KR", Inter, system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --canvas: #080d14;
      --surface: #101824;
      --ink: #f5f7fb;
      --muted: #a8b0c2;
      --hairline: #263244;
      --band: #dfe8ff;
      --accent: #7fb4ff;
      --accent-soft: #16233a;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      margin: 0;
      word-break: keep-all;
    }
    header {
      align-items: center;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      gap: 14px;
      justify-content: space-between;
      padding: 20px 32px;
    }
    .actions {
      align-items: center;
      display: flex;
      gap: 10px;
    }
    a,
    button {
      border-radius: 999px;
      font: inherit;
    }
    header a,
    [data-theme-toggle] {
      background: transparent;
      border: 1px solid var(--hairline);
      color: var(--ink);
      padding: 8px 14px;
      text-decoration: none;
    }
    [data-theme-toggle] { cursor: pointer; }
    main {
      display: grid;
      gap: 56px;
      padding: 72px 32px 80px;
    }
    .hero {
      align-items: stretch;
      display: grid;
      gap: 44px;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      min-height: 68vh;
    }
    .copy {
      align-content: center;
      display: grid;
      gap: 24px;
      max-width: 820px;
    }
    h1 {
      color: var(--band);
      font-size: 58px;
      font-weight: 650;
      line-height: 1.12;
      margin: 0;
    }
    p {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.62;
      margin: 0;
      max-width: 680px;
    }
    .button {
      background: var(--ink);
      color: var(--canvas);
      display: inline-block;
      justify-self: start;
      padding: 13px 22px;
      text-decoration: none;
    }
    .panel {
      align-content: end;
      background: var(--band);
      border-radius: 8px;
      color: var(--canvas);
      display: grid;
      min-height: 420px;
      padding: 32px;
    }
    .panel p {
      color: color-mix(in srgb, var(--canvas) 82%, transparent);
      font-size: 24px;
      line-height: 1.45;
    }
    .features {
      border-top: 1px solid var(--hairline);
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding-top: 28px;
    }
    .feature {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.55;
      min-height: 132px;
      padding: 22px;
    }
    @media (max-width: 820px) {
      header { align-items: flex-start; padding: 18px 20px; }
      main { gap: 40px; padding: 44px 20px 56px; }
      .hero { grid-template-columns: 1fr; min-height: auto; }
      h1 { font-size: 40px; }
      .panel { min-height: 260px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>결</strong>
    <div class="actions">
      <button type="button" data-theme-toggle aria-label="테마 전환">테마</button>
      <a href="#">Start with the template</a>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="copy">
        <h1>에이전트를 위한 한국어와 영어 네이티브 문서.</h1>
        <p>브리프, 리포트, 덱, 변경 기록, 랜딩 페이지를 매번 다시 설계하지 않고 하나의 차분한 스택으로 만듭니다.</p>
        <a class="button" href="#">Start with the template</a>
      </div>
      <div class="panel"><p>18개 템플릿 · 2개 언어 · 구조 검증 · Kami 출처 보존</p></div>
    </section>
    <section class="features">
      <div class="feature">한국어와 영어를 모두 first-class 산출물로 다룹니다.</div>
      <div class="feature">템플릿은 self-contained 형태를 유지합니다.</div>
      <div class="feature">검증이 registry의 품질을 지킵니다.</div>
    </section>
  </main>
  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('[data-theme-toggle]');
    let saved = null;
    try {
      saved = localStorage.getItem('gyeol-theme');
    } catch {
      saved = null;
    }
    if (saved) root.dataset.theme = saved;
    toggle?.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try {
        localStorage.setItem('gyeol-theme', next);
      } catch {
        /* Theme still changes for this page view when storage is unavailable. */
      }
    });
  </script>
</body>
</html>
